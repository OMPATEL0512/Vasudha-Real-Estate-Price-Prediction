<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <linearGradient id="vrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D58C" />
      <stop offset="35%" stop-color="#C9922E" />
      <stop offset="70%" stop-color="#A27118" />
      <stop offset="100%" stop-color="#E8C468" />
    </linearGradient>
    <linearGradient id="vrGoldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9922E" />
      <stop offset="50%" stop-color="#F8E5B9" />
      <stop offset="100%" stop-color="#DFB15B" />
    </linearGradient>
    <linearGradient id="vrNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2845" />
      <stop offset="50%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Golden 'V' Stem -->
  <polygon points="120,130 165,130 230,230 200,230" fill="url(#vrGold)" />
  <polygon points="160,130 185,130 235,210 220,210" fill="url(#vrGoldLight)" />

  <!-- Center Skyscraper 1 (Tall Left Center) -->
  <polygon points="232,122 250,110 250,230 232,230" fill="url(#vrNavy)" stroke="#0A111F" stroke-width="1.5" />
  <polygon points="250,110 262,118 262,230 250,230" fill="url(#vrGold)" />
  <!-- Window Slits Skyscraper 1 -->
  <line x1="240" y1="130" x2="240" y2="220" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />
  <line x1="256" y1="130" x2="256" y2="220" stroke="#0E1726" stroke-width="1.5" opacity="0.8" />

  <!-- Center Skyscraper 2 (Taller Main Peak) -->
  <polygon points="252,95 272,82 272,230 252,230" fill="#0A111F" stroke="#0E1726" stroke-width="1" />
  <polygon points="272,82 288,92 288,230 272,230" fill="url(#vrGoldLight)" />
  <line x1="262" y1="105" x2="262" y2="220" stroke="#38BDF8" stroke-width="1.5" opacity="0.7" />
  <line x1="280" y1="105" x2="280" y2="220" stroke="#0E1726" stroke-width="1.5" opacity="0.8" />

  <!-- Center Skyscraper 3 (Right Mid) -->
  <polygon points="288,140 304,130 304,230 288,230" fill="url(#vrGold)" />
  <polygon points="304,130 316,138 316,230 304,230" fill="#0A111F" />
  <line x1="296" y1="150" x2="296" y2="220" stroke="#0E1726" stroke-width="1.5" opacity="0.8" />

  <!-- Right Navy 'R' Loop & Leg -->
  <!-- R Stem & Loop -->
  <path d="M280,122 L320,122 C355,122 368,140 368,162 C368,184 352,198 322,198 L296,198" fill="none" stroke="#0E1726" stroke-width="22" stroke-linecap="square" stroke-linejoin="round" />
  <path d="M282,122 L320,122 C355,122 368,140 368,162 C368,184 352,198 322,198 L296,198" fill="none" stroke="url(#vrNavy)" stroke-width="18" stroke-linecap="square" stroke-linejoin="round" />

  <!-- R Leg Sweeping Out -->
  <path d="M312,194 C328,194 345,210 365,232 L395,268 C390,268 375,268 355,246 L324,204 Z" fill="url(#vrNavy)" stroke="#0E1726" stroke-width="1" />

  <!-- Sweeping Base Arc Swoosh -->
  <path d="M110,256 Q 250,230 395,268" fill="none" stroke="#0E1726" stroke-width="6" stroke-linecap="round" />
  <path d="M120,254 Q 250,232 385,266" fill="none" stroke="url(#vrGold)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Brand Typography -->
  <text x="250" y="320" font-family="'Fraunces', 'Cinzel', serif" font-size="44" font-weight="700" letter-spacing="12" fill="#0E1726" text-anchor="middle">VASUDHA</text>
  <text x="250" y="320" font-family="'Fraunces', 'Cinzel', serif" font-size="44" font-weight="700" letter-spacing="12" fill="url(#vrGoldLight)" text-anchor="middle" opacity="0.95">VASUDHA</text>

  <!-- Subtitle with side lines -->
  <line x1="90" y1="348" x2="180" y2="348" stroke="url(#vrGold)" stroke-width="1.5" opacity="0.8" />
  <text x="250" y="353" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="6" fill="#C9922E" text-anchor="middle">REAL ESTATE</text>
  <line x1="320" y1="348" x2="410" y2="348" stroke="url(#vrGold)" stroke-width="1.5" opacity="0.8" />
</svg>
